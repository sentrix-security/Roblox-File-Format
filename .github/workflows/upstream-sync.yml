name: Sync upstream and open PR

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/MaximumADHD/Roblox-File-Format.git
          git fetch upstream --prune

      - name: Build sync branch (upstream minus workflow files)
        run: |
          BASE_BRANCH="main"
          UPSTREAM_BRANCH="main"
          SYNC_BRANCH="sync/upstream"

          BASE=$(git merge-base "origin/$BASE_BRANCH" "upstream/$UPSTREAM_BRANCH")
          UPSTREAM_SHA=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          echo "Merge-base: $BASE"

          # Start from the merge-base, then make the tree equal to upstream's
          git checkout -q -B "$SYNC_BRANCH" "$BASE"
          git read-tree -u --reset "upstream/$UPSTREAM_BRANCH"

          # Strip upstream's workflow changes: restore the merge-base version
          git rm -rq --cached --ignore-unmatch .github/workflows
          rm -rf .github/workflows
          if git cat-file -e "$BASE:.github/workflows" 2>/dev/null; then
            git checkout "$BASE" -- .github/workflows
          fi

          if git diff --cached --quiet "$BASE"; then
            echo "No non-workflow changes upstream, nothing to sync."
            echo "CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Deterministic commit (same inputs -> same SHA), so reruns don't create noise
          UP_DATE=$(git log -1 --format=%cI "$UPSTREAM_SHA")
          GIT_AUTHOR_DATE="$UP_DATE" GIT_COMMITTER_DATE="$UP_DATE" \
            git commit -q -m "Sync upstream changes (up to ${UPSTREAM_SHA:0:7})" \
                          -m "Squashed upstream changes since the merge-base. Changes under .github/workflows are excluded."

          git push origin "$SYNC_BRANCH" --force
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Ensure label exists
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync \
            --repo "${{ github.repository }}" \
            --description "Automated upstream sync PRs" \
            --color "0e8a16" \
            || echo "Label already exists"

      - name: Create or update PR
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --count origin/main..origin/sync/upstream)
          echo "sync/upstream is $AHEAD commits ahead of main"

          if [ "$AHEAD" -eq 0 ]; then
            echo "Nothing to sync, skipping PR."
            exit 0
          fi

          EXISTING=$(gh pr list --repo "${{ github.repository }}" \
            --head sync/upstream --state all --json number,state \
            --jq 'sort_by(.number) | last')

          if [ -z "$EXISTING" ]; then
            STATE="NONE"
          else
            STATE=$(echo "$EXISTING" | jq -r '.state')
            NUMBER=$(echo "$EXISTING" | jq -r '.number')
          fi

          echo "Latest PR state for sync/upstream: $STATE"

          case "$STATE" in
            OPEN)
              echo "PR #$NUMBER already open, nothing to do."
              ;;
            CLOSED)
              echo "Reopening closed PR #$NUMBER."
              gh pr reopen "$NUMBER" --repo "${{ github.repository }}"
              ;;
            MERGED|NONE)
              echo "Creating new PR (previous one was merged or none exists)."
              gh pr create \
                --repo "${{ github.repository }}" \
                --head sync/upstream \
                --base main \
                --title "Sync upstream changes" \
                --body "Automated PR to bring upstream changes into this fork. Changes under \`.github/workflows\` are intentionally excluded." \
                --label upstream-sync
              ;;
          esac
