name: Sync upstream and open PR

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/MaximumADHD/Roblox-File-Format.git
          git fetch upstream --prune
          git fetch origin --prune

      - name: Create or update sync branch
        run: |
          BASE_BRANCH="main"
          UPSTREAM_BRANCH="main"
          SYNC_BRANCH="sync/upstream"

          git checkout -B "$SYNC_BRANCH" "origin/$BASE_BRANCH"

          # Merge upstream into the sync branch. If conflicts occur, this step fails (which is good).
          git merge --no-edit "upstream/$UPSTREAM_BRANCH"

          # Push the sync branch
          git push -u origin "$SYNC_BRANCH" --force-with-lease

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-sync \
            --description "Automated upstream sync PRs" \
            --color "0e8a16" \
            || echo "Label already exists"

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --right-only --count origin/main...origin/sync/upstream)
          echo "sync/upstream is $AHEAD commits ahead of main"

          if [ "$AHEAD" -eq 0 ]; then
            echo "Nothing to sync, skipping PR."
            exit 0
          fi

          # Look for any existing PR (open OR closed) for this head branch
          EXISTING=$(gh pr list --head sync/upstream --state all \
            --json number,state --jq '.[0]')

          if [ -z "$EXISTING" ]; then
            echo "No existing PR found, creating one."
            gh pr create \
              --head sync/upstream \
              --base main \
              --title "Sync upstream changes" \
              --body "Automated PR to bring upstream changes into this fork." \
              --label upstream-sync
          else
            NUMBER=$(echo "$EXISTING" | jq -r '.number')
            STATE=$(echo "$EXISTING" | jq -r '.state')
            echo "Found PR #$NUMBER with state $STATE"

            if [ "$STATE" = "OPEN" ]; then
              echo "PR already open, nothing to do (branch was force-pushed with new commits)."
            elif [ "$STATE" = "CLOSED" ]; then
              echo "Reopening closed PR #$NUMBER."
              gh pr reopen "$NUMBER"
            fi
          fi
